<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | PrintNexa 3D Printing &amp; Prototyping</title>
  <meta name="description" content="The page or asset you requested could not be located in the PrintNexa engineering repository." />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="128x128" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="index.css" />

  <style>
    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-main, #F7F5F1);
      color: var(--text-primary, #15191B);
      position: relative;
      overflow-x: hidden;
      font-family: var(--font-body, 'Inter', sans-serif);
      transition: background-color var(--transition-med), color var(--transition-med);
    }

    [data-theme="dark"] body {
      background-color: #090B0C;
    }

    .error-top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(16px, 2.5vh, 28px) clamp(16px, 2.5vw, 32px);
      pointer-events: none;
    }

    .error-top-bar > * {
      pointer-events: auto;
    }

    .error-top-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      padding: 6px 14px 6px 8px;
      background: var(--bg-surface-glass, rgba(255, 255, 255, 0.85));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle, #E3DED8);
      border-radius: 9999px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      transition: all var(--transition-fast);
    }

    [data-theme="dark"] .error-top-brand {
      background: rgba(24, 29, 32, 0.85);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.4);
    }

    .error-top-brand:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 100, 45, 0.45);
      box-shadow: 0 6px 20px rgba(255, 100, 45, 0.2);
    }

    .error-top-brand .brand-logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      border: 1.5px solid rgba(255, 100, 45, 0.45);
      flex-shrink: 0;
      transition: transform var(--transition-fast), border-color var(--transition-fast);
    }

    .error-top-brand:hover .brand-logo-icon {
      transform: scale(1.06);
      border-color: var(--primary-orange, #FF642D);
    }

    .error-top-brand .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .error-top-brand .brand-text-block {
      display: flex;
      flex-direction: column;
    }

    .error-top-brand .brand-title {
      font-family: var(--font-heading, 'Outfit', sans-serif);
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text-primary, #15191B);
      line-height: 1.1;
      text-align: start;
    }

    [data-theme="dark"] .error-top-brand .brand-title {
      color: #FFFFFF;
    }

    .error-top-brand .brand-subtitle {
      font-family: var(--font-mono, 'Space Grotesk', monospace);
      font-size: 0.54rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-muted, #7A7265);
      line-height: 1.2;
      text-align: start;
    }

    .error-controls-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-surface-glass, rgba(255, 255, 255, 0.85));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 6px 10px;
      border-radius: 9999px;
      border: 1px solid var(--border-subtle, #E3DED8);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      transition: all var(--transition-med);
    }

    [data-theme="dark"] .error-controls-wrap {
      background: rgba(24, 29, 32, 0.85);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.4);
    }

    .error-hero-section {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(60px, 10vh, 110px) 24px;
      position: relative;
      box-sizing: border-box;
      text-align: center;
    }

    .error-bg-mesh {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 100, 45, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 100, 45, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.95) 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.95) 0%, transparent 75%);
      pointer-events: none;
    }

    .error-ambient-glow {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 100, 45, 0.12) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    [data-theme="dark"] .error-ambient-glow {
      background: radial-gradient(circle, rgba(255, 100, 45, 0.18) 0%, transparent 70%);
    }

    .error-card-box {
      position: relative;
      z-index: 2;
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .error-glitch-code {
      font-family: var(--font-heading, 'Outfit', sans-serif);
      font-size: clamp(5.5rem, 14vw, 10rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.05em;
      color: var(--primary-orange, #FF642D);
      margin-block: 16px 20px;
      text-shadow: 0 10px 40px var(--orange-glow, rgba(255, 100, 45, 0.3));
    }

    .error-heading {
      font-family: var(--font-heading, 'Outfit', sans-serif);
      font-size: clamp(2.35rem, 4.2vw, 3.75rem);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: var(--text-primary, #15191B);
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    [data-theme="dark"] .error-heading {
      color: #FFFFFF;
    }

    .error-desc {
      font-family: var(--font-body, 'Inter', sans-serif);
      font-size: clamp(1.02rem, 1.2vw, 1.18rem);
      color: var(--text-secondary, #5C5549);
      line-height: 1.55;
      max-width: 620px;
      margin: 0 auto 36px;
    }

    [data-theme="dark"] .error-desc {
      color: #A39E93;
    }

    .error-actions-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-outline-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: transparent;
      color: var(--text-primary, #15191B);
      border: 1.5px solid var(--border-btn-secondary, rgba(21, 25, 27, 0.25));
      font-family: var(--font-heading, 'Outfit', sans-serif);
      font-weight: 600;
      font-size: 0.9375rem;
      padding: 13px 28px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all var(--transition-fast);
    }

    [data-theme="dark"] .btn-outline-pill {
      border-color: rgba(255, 255, 255, 0.28);
      color: #FFFFFF;
    }

    .btn-outline-pill:hover {
      border-color: var(--primary-orange, #FF642D);
      color: var(--primary-orange, #FF642D);
      transform: translateY(-2px);
    }

    [dir="rtl"] .error-actions-group .btn-orange-pill i {
      transform: scaleX(-1);
    }
</style>
</head>
<body>

  <header class="error-top-bar" aria-label="Page header">

    <a href="index.html" class="error-top-brand" aria-label="PrintNexa Home">
      <div class="brand-logo-icon">
        <img src="assets/printnexa_logo.png" alt="PrintNexa 3D Printing Logo" class="brand-logo-img" />
      </div>
      <div class="brand-text-block">
        <span class="brand-title">PRINT<span class="brand-orange">NEXA</span></span>
        <span class="brand-subtitle">3D PRINTING &amp; PROTOTYPING</span>
      </div>
    </a>

    <div class="error-controls-wrap" aria-label="Appearance and text direction controls">
      <button class="icon-toggle-btn" id="themeToggleBtn" aria-label="Toggle Theme" title="Toggle Light / Dark Mode">
        <i class="fa-solid fa-moon theme-icon-dark" aria-hidden="true"></i>
        <i class="fa-solid fa-sun theme-icon-light" aria-hidden="true"></i>
      </button>

      <button class="badge-toggle-btn" id="rtlToggleBtn" aria-label="Toggle Text Direction" title="Toggle RTL / LTR">
        <span id="rtlBtnText">RTL</span>
      </button>
    </div>
  </header>

  <main class="error-hero-section">

    <div class="error-bg-mesh" aria-hidden="true"></div>
    <div class="error-ambient-glow" aria-hidden="true"></div>

    <div class="section-container">
      <div class="error-card-box">
        <div class="section-kicker">
          <span>ERROR 404 &bull; CAD REPOSITORY</span>
        </div>

        <div class="error-glitch-code">404</div>

        <h1 class="error-heading">TOOLPATH NOT FOUND. <span class="text-orange">GEOMETRY MISSING.</span></h1>

        <p class="error-desc">
          The file or manufacturing resource you requested does not exist or has been relocated in our digital CAD library.
        </p>

        <div class="error-actions-group">
          <a href="index.html" class="btn-orange-pill">
            <span>Return to Home</span>
            <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
          </a>
          <a href="service.html" class="btn-outline-pill">
            <span>Explore Services</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
